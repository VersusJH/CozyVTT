# Builds the backend and frontend images and pushes them to ghcr.io,
# after CI has passed on main.
name: Publish images

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

jobs:
  publish:
    # Only when CI passed on a push to main, not on a pull request.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [backend, frontend]
    steps:
      # The commit CI tested.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image }}
          file: ${{ matrix.image }}/Dockerfile.prod
          push: true
          tags: ghcr.io/versusjh/cozyvtt-${{ matrix.image }}:latest
